name: docs-check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'migrations/**'
      - 'scripts/docs-check.mjs'
      - '.github/workflows/docs-check.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'migrations/**'
      - 'scripts/docs-check.mjs'
      - '.github/workflows/docs-check.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-guard:
    name: Docs + checklist guard (v1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run docs check
        run: node scripts/docs-check.mjs
        env:
          # Diff-based checklist sync. Base SHA for PRs; for push use the commit
          # before HEAD (fetch-depth: 0 makes it available). Manual dispatch skips.
          CHECKLIST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
