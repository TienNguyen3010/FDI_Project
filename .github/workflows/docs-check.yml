name: docs-check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-check.mjs'
      - '.github/workflows/docs-check.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-check.mjs'
      - '.github/workflows/docs-check.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-guard:
    name: Docs guard (v1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run docs check
        run: node scripts/docs-check.mjs
